<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Historical Timeline</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:'Segoe UI',Tahoma,sans-serif;
    color:#f8fafc;

    background:
        radial-gradient(circle at top left,
            rgba(59,130,246,.18),
            transparent 40%),
        radial-gradient(circle at bottom right,
            rgba(14,165,233,.15),
            transparent 40%),
        linear-gradient(
            135deg,
            #0f172a 0%,
            #111827 50%,
            #1e293b 100%
        );
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.03),
            transparent
        );
    pointer-events:none;
    z-index:0;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.05), transparent 22%),
        radial-gradient(circle at 80% 30%, rgba(59,130,246,.08), transparent 25%),
        radial-gradient(circle at 60% 80%, rgba(14,165,233,.08), transparent 30%);
    animation:skyGlow 12s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes skyGlow{
    from{
        opacity:.6;
        transform:scale(1);
    }
    to{
        opacity:1;
        transform:scale(1.05);
    }
}

.header{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    z-index:1000;
}

.header h1{
    font-size:34px;
    font-weight:700;
}

.header p{
    color:#94a3b8;
}

.country-controls{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    z-index:1000;
}

.country-controls label{
    color:#e2e8f0;
    font-weight:600;
    margin-right:10px;
}

.country-controls select{
    padding:10px 16px;
    border-radius:10px;
    border:1px solid #334155;
    background:#1e293b;
    color:white;
    font-size:15px;
    min-width:180px;
    outline:none;
}

.video-export{
    padding:10px 16px;
    border:1px solid #38bdf8;
    border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#0ea5e9);
    color:white;
    font-size:14px;
    font-weight:700;
}

.video-export:disabled{
    opacity:.6;
    cursor:wait;
}

#countryStatus{
    margin-top:6px;
    font-size:14px;
    color:#94a3b8;
}

#videoStatus{
    margin-top:6px;
    color:#7dd3fc;
    font-size:13px;
}

.wrapper{
    display:flex;
    height:100vh;
    padding-top:76px;
}

.side{
    width:27%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:340px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.04)
        );

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.10);

    border-radius:24px;

    padding:24px;

    text-align:center;

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);

    transition:.4s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:
        0 20px 50px rgba(0,0,0,.45);
}

.card img{
    width:250px;
    height:320px;
    object-fit:cover;

    border-radius:18px;

    border:2px solid rgba(255,255,255,.15);

    box-shadow:
        0 10px 25px rgba(0,0,0,.35);
}

.title{
    margin-top:18px;
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#94a3b8;
}

.name{
    margin-top:8px;
    font-size:28px;
    color:#ffffff;
    font-weight:700;
    line-height:1.25;
}

#presidentArabicName,
#pmArabicName,
#speakerArabicName{
    color:#38bdf8;
    font-size:24px;
    direction:rtl;
}

.period{
    margin-top:14px;

    display:inline-block;

    padding:7px 18px;

    border-radius:999px;

    background:rgba(56,189,248,.15);

    color:#7dd3fc;

    font-size:14px;

    font-weight:600;
}

.periodSmall{
    margin-top:6px;
    color:#94a3b8;
    font-size:12px;
}

.timeline-column{
    width:19%;
    display:flex;
    flex-direction:column;
    min-height:0;
}

.timeline{
    width:100%;
    flex:1;
    min-height:0;
    position:relative;
    overflow:hidden;
}

.wrapper:has(.incident-bubble){
    overflow-x:auto;
}

.wrapper:has(.incident-bubble) .side{
    flex:1 0 330px;
}

.timeline-column:has(.incident-bubble){
    width:330px;
    flex-shrink:0;
}

.timeline:has(.incident-bubble) .line,
.timeline:has(.incident-bubble) .center-year{
    left:70px;
}

.timeline:has(.incident-bubble) .year{
    justify-content:flex-start;
    padding-left:45px;
}

.timeline:has(.incident-bubble) .year.active{
    color:transparent;
}

.line{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    width:5px;
    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            to bottom,
            #38bdf8,
            #2563eb
        );
}

.center-year{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:130px;
    height:130px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #0ea5e9
        );

    border:4px solid rgba(255,255,255,.2);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    font-weight:800;

    color:white;

    box-shadow:
        0 0 40px rgba(37,99,235,.45);

    z-index:100;
}

.years{
    position:absolute;
    width:100%;
    transition:transform 1.2s linear;
}

.year{
    position:relative;
    height:80px;
    display:flex;
    justify-content:center;
    align-items:center;

    font-size:20px;
    color:#64748b;

    transition:.4s;
}

.year.active{
    color:white;
    font-size:42px;
    font-weight:800;

    text-shadow:
        0 0 20px rgba(56,189,248,.85);
}

.controls{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
}

button{
    padding:10px 20px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    margin:0 5px;

    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

.pause{
    background:#dc2626;
    color:white;
}

.play{
    background:#16a34a;
    color:white;
}

.year-value{
    font-size:48px;
    font-weight:bold;
    color:white;
}

.incident-bubble{
    position:absolute;

    left:150px;
    top:50%;

    transform:translateY(-50%);

    width:190px;

    padding:10px 12px;

    border-radius:14px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.05)
        );

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.1);

    border-left:4px solid #38bdf8;

    color:#e2e8f0;

    font-size:11px;

    line-height:1.3;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.incident-bubble::before{
    content:"";
    position:absolute;
    left:-7px;
    top:50%;
    width:12px;
    height:12px;
    background:#38bdf8;
    transform:translateY(-50%) rotate(45deg);
}

.year.active .incident-bubble{
    box-shadow:
        0 10px 28px rgba(0,0,0,.28),
        0 0 0 1px rgba(56,189,248,.4);
}

.incident-bubble span{
    display:block;
}

.incident-bubble [lang="en"]{
    font-weight:700;
}

.incident-bubble [lang="ar"]{
    margin-top:5px;
    color:#cbd5e1;
    direction:rtl;
}

.flag-container{
    flex:0 0 130px;

    display:grid;

    grid-template-columns:70px 140px 70px;

    gap:12px;

    align-items:center;

    justify-content:center;

    padding:10px 0 24px;
}

.flag-container[hidden]{
    display:none;
}

.flag-slot{
    text-align:center;
    opacity:.3;
    transition:.3s;
}

.flag-slot.current{
    opacity:1;
}

.flag-container img{
    width:70px;
    height:45px;
    object-fit:contain;
    border-radius:6px;
}

.flag-slot.current img{
    width:140px;
    height:90px;

    border-radius:10px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.40);
}

.flag-slot figcaption{
    margin-top:6px;
    font-size:11px;
    color:#94a3b8;
}

@media (max-aspect-ratio: 4/5){
    .wrapper{
        width:min(100%, 56.25vh);
        width:min(100%, 56.25dvh);
        height:100vh;
        height:100dvh;
        margin:0 auto;
        padding:112px 10px 12px;
        flex-direction:column;
        gap:8px;
        overflow:hidden;
    }

    .side,
    .wrapper:has(.incident-bubble) .side{
        width:100%;
        flex:0 1 auto;
        min-height:0;
        padding:0;
    }

    .card{
        width:100%;
        display:grid;
        grid-template-columns:64px minmax(0, 1fr);
        grid-template-rows:repeat(4, auto) auto;
        column-gap:12px;
        align-items:center;
        padding:9px 12px;
        text-align:left;
    }

    .card img{
        width:64px;
        height:82px;
        grid-row:1 / span 5;
    }

    .title{
        margin-top:0;
        font-size:9px;
        letter-spacing:1px;
    }

    .name{
        margin-top:3px;
        font-size:17px;
        line-height:1.15;
        overflow-wrap:anywhere;
    }

    #presidentArabicName,
    #pmArabicName,
    #speakerArabicName{
        font-size:15px;
    }

    .period{
        justify-self:start;
        margin-top:4px;
        padding:4px 10px;
        font-size:11px;
    }

    .timeline-column,
    .timeline-column:has(.incident-bubble){
        width:100%;
        flex:1 1 auto;
        min-height:120px;
    }

    .flag-container{
        flex:0 0 72px;
        grid-template-columns:42px 100px 42px;
        gap:8px;
        padding:2px 0 5px;
    }

    .flag-container img{
        width:42px;
        height:28px;
    }

    .flag-slot.current img{
        width:100px;
        height:64px;
    }

    .flag-slot figcaption{
        font-size:9px;
    }

    .year{
        height:56px;
        font-size:16px;
    }

    .year.active{
        font-size:32px;
    }

    .center-year{
        width:100px;
        height:100px;
        font-size:27px;
    }

    .country-controls{
        top:8px;
        padding:0 10px;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-wrap:wrap;
        gap:6px;
    }

    .country-controls label{
        margin-right:0;
    }

    .country-controls select{
        min-width:0;
        width:min(190px, 52vw);
        padding:8px 10px;
    }

    .video-export{
        padding:8px 12px;
        font-size:12px;
    }

    #countryStatus,
    #videoStatus{
        flex-basis:100%;
        margin-top:0;
        overflow-wrap:anywhere;
    }

    .timeline:has(.incident-bubble) .line,
    .timeline:has(.incident-bubble) .center-year{
        left:56px;
    }

    .timeline:has(.incident-bubble) .year{
        padding-left:30px;
    }

    .incident-bubble{
        left:132px;
        width:calc(100% - 140px);
        max-width:190px;
        font-size:10px;
    }
}

</style>
</head>

function playYear() {
    clearInterval(yearTimer);

    const presidentsForYear =
        findPersons(activeCountry.presidents, currentYear);

    const pmsForYear =
        findPersons(activeCountry.primeMinisters, currentYear);

  
	const speakersForYear =
    findPersons(
        activeCountry.parliamentPresidents,
        currentYear
    );

const count = Math.max(
    presidentsForYear.length || 1,
    pmsForYear.length || 1,
    speakersForYear.length || 1
);

    currentIndex = 0;

    updateYearDisplay();
    showCurrentPerson();
	END_YEAR =  activeCountry.endYear?activeCountry.endYear:2026;
    yearTimer = setInterval(() => {

        currentIndex++;

        if (currentIndex >= count) {

            clearInterval(yearTimer);

            currentYear++;

            if (currentYear > END_YEAR) {
                currentYear = activeCountry.startYear;
            }

            playYear();
            return;
        }

        showCurrentPerson();

    }, PERSON_DURATION); // always 1 second per person
}

    slot.style.visibility = flag ? "visible" : "hidden";
    if (flag) {

        image.alt = document.getElementById("countrySelect").value + " flag (" + flag.start + "-" + (flag.end > END_YEAR ? "present" : flag.end) + ")";
        period.textContent = "[" + flag.start + "-" + (flag.end > END_YEAR ? "" : flag.end) + "]";

    }

function getVideoYearEnd(country) {
    return country.endYear != null ? country.endYear : 2026;
}

function getVideoFrames(country) {
    const frames = [];
    for (let year = country.startYear; year <= getVideoYearEnd(country); year++) {
        const presidentCount = findPersons(country.presidents, year).length;
        const pmCount = findPersons(country.primeMinisters, year).length;
        const speakerCount = findPersons(country.parliamentPresidents, year).length;
        const count = Math.max(presidentCount || 1, pmCount || 1, speakerCount || 1);
        for (let index = 0; index < count; index++) {
            frames.push({
                year,
                index,
                count,
                incident: country.incidents.find(item => item.year === year),
                flag: country.flags.find(item => year >= item.start && year < item.end)
            });
        }
    }
    return frames;
}

function getVideoRole(list, year, index, count, title) {
    const people = findPersons(list, year);
    if (!people.length) {
        return { title, name: "-", arabicName: "-", img: "" };
    }
    const personIndex = Math.min(
        Math.floor((index * people.length) / count),
        people.length - 1
    );
    const person = people[personIndex];
    return {
        title,
        name: person.name,
        arabicName: person.arabicName,
        img: person.img,
        period: `[${person.start}-${person.end > 2026 ? "" : person.end}]`
    };
}

async function loadVideoImage(src, localImagesDirectory) {
    if (!src) {
        return { src, image: null };
    }
    let imageSource = src;
    if (localImagesDirectory && src.startsWith("images/")) {
        const fileName = src.slice("images/".length);
        let file;
        try {
            file = await (await localImagesDirectory.getFileHandle(fileName)).getFile();
        } catch (error) {
            throw new Error(`Could not read images/${fileName} from the selected images folder: ${error.message}`);
        }
        imageSource = URL.createObjectURL(file);
        videoImageObjectUrls.push(imageSource);
    }
    return new Promise(resolve => {
        const image = new Image();
        const imageUrl = new URL(imageSource, document.baseURI);
        if (!imageSource.startsWith("blob:")
            && (imageUrl.protocol !== window.location.protocol || imageUrl.host !== window.location.host)) {
            image.crossOrigin = "anonymous";
        }
        image.onload = () => resolve({ src, image });
        image.onerror = () => resolve({ src, image: null });
        image.src = imageUrl.href;
    });
}

function roundedVideoRect(context, x, y, width, height, radius) {
    const corner = Math.min(radius, width / 2, height / 2);
    context.beginPath();
    context.moveTo(x + corner, y);
    context.lineTo(x + width - corner, y);
    context.quadraticCurveTo(x + width, y, x + width, y + corner);
    context.lineTo(x + width, y + height - corner);
    context.quadraticCurveTo(x + width, y + height, x + width - corner, y + height);
    context.lineTo(x + corner, y + height);
    context.quadraticCurveTo(x, y + height, x, y + height - corner);
    context.lineTo(x, y + corner);
    context.quadraticCurveTo(x, y, x + corner, y);
    context.closePath();
}

function wrapVideoText(context, text, x, y, maxWidth, lineHeight, maxLines) {
    const words = String(text || "").split(/\s+/);
    let line = "";
    let lineNumber = 0;
    for (const word of words) {
        const nextLine = line ? line + " " + word : word;
        if (context.measureText(nextLine).width > maxWidth && line) {
            context.fillText(line, x, y + lineNumber * lineHeight);
            lineNumber++;
            line = word;
            if (lineNumber >= maxLines - 1) {
                break;
            }
        } else {
            line = nextLine;
        }
    }
    if (line && lineNumber < maxLines) {
        context.fillText(line, x, y + lineNumber * lineHeight, maxWidth);
    }
}

function drawTikTokFrame(context, canvas, countryName, frame, roles, images, progress) {
    const width = canvas.width;
    const height = canvas.height;
    const background = context.createLinearGradient(0, 0, width, height);
    background.addColorStop(0, "#0b1220");
    background.addColorStop(.52, "#111827");
    background.addColorStop(1, "#172554");
    context.fillStyle = background;
    context.fillRect(0, 0, width, height);

    const glow = context.createRadialGradient(width * .5, height * .2, 20, width * .5, height * .2, 760);
    glow.addColorStop(0, "rgba(56,189,248,.24)");
    glow.addColorStop(1, "rgba(56,189,248,0)");
    context.fillStyle = glow;
    context.fillRect(0, 0, width, height);

    context.textAlign = "center";
    context.fillStyle = "#7dd3fc";
    context.font = "600 28px Segoe UI, sans-serif";
    context.fillText("HISTORY THROUGH THE YEARS", width / 2, 112);
    context.fillStyle = "#f8fafc";
    context.font = "700 58px Segoe UI, sans-serif";
    context.fillText(countryName, width / 2, 190, width - 120);
    context.fillStyle = "#94a3b8";
    context.font = "400 25px Segoe UI, sans-serif";
    context.fillText("LEADERSHIP TIMELINE", width / 2, 238);

    const yearGlow = context.createRadialGradient(width / 2, 385, 15, width / 2, 385, 260);
    yearGlow.addColorStop(0, "rgba(37,99,235,.30)");
    yearGlow.addColorStop(1, "rgba(37,99,235,0)");
    context.fillStyle = yearGlow;
    context.fillRect(190, 260, width - 380, 260);
    const flag = frame.flag && images.get(frame.flag.img);
    if (flag) {
        const flagScale = Math.min(132 / flag.width, 78 / flag.height);
        const flagWidth = flag.width * flagScale;
        const flagHeight = flag.height * flagScale;
        context.drawImage(
            flag,
            130 + (132 - flagWidth) / 2,
            330 + (78 - flagHeight) / 2,
            flagWidth,
            flagHeight
        );
    }
    const yearBadge = context.createLinearGradient(width / 2 - 100, 290, width / 2 + 100, 490);
    yearBadge.addColorStop(0, "#2563eb");
    yearBadge.addColorStop(1, "#0ea5e9");
    context.beginPath();
    context.arc(width / 2, 392, 94, 0, Math.PI * 2);
    context.fillStyle = yearBadge;
    context.fill();
    context.lineWidth = 6;
    context.strokeStyle = "rgba(255,255,255,.2)";
    context.stroke();
    context.fillStyle = "#ffffff";
    context.font = "700 112px Segoe UI, sans-serif";
    context.fillText(String(frame.year), width / 2, 430);
    if (frame.incident) {
        context.fillStyle = "#e2e8f0";
        context.font = "600 24px Segoe UI, sans-serif";
        context.fillText(frame.incident.name, width / 2, 448, width - 220);
        context.fillStyle = "#bae6fd";
        context.font = "500 24px Segoe UI, sans-serif";
        context.direction = "rtl";
        context.fillText(frame.incident["name-arabic"] || "", width / 2, 488, width - 220);
        context.direction = "inherit";
    }

    const cardGap = 24;
    const cardHeight = roles.length === 3 ? 340 : 350;
    const groupHeight = roles.length * cardHeight + (roles.length - 1) * cardGap;
    const firstCardY = 530 + (1060 - groupHeight) / 2;
    roles.forEach((role, roleIndex) => {
        const x = 56;
        const y = firstCardY + roleIndex * (cardHeight + cardGap);
        const cardWidth = width - 112;
        const cardGradient = context.createLinearGradient(x, y, x, y + cardHeight);
        cardGradient.addColorStop(0, "rgba(255,255,255,.10)");
        cardGradient.addColorStop(1, "rgba(255,255,255,.045)");
        context.fillStyle = cardGradient;
        roundedVideoRect(context, x, y, cardWidth, cardHeight, 26);
        context.fill();
        context.shadowColor = "rgba(0,0,0,.28)";
        context.shadowBlur = 24;
        context.shadowOffsetY = 10;
        context.strokeStyle = "rgba(255,255,255,.14)";
        context.lineWidth = 2;
        context.stroke();
        context.shadowColor = "transparent";
        context.shadowBlur = 0;
        context.shadowOffsetY = 0;

        const imageX = x + 24;
        const imageY = y + (cardHeight - 292) / 2;
        const image = images.get(role.img);
        context.save();
        roundedVideoRect(context, imageX, imageY, 216, 292, 18);
        context.clip();
        if (image) {
            const scale = Math.max(216 / image.width, 292 / image.height);
            const imageWidth = image.width * scale;
            const imageHeight = image.height * scale;
            context.drawImage(
                image,
                imageX + (216 - imageWidth) / 2,
                imageY + (292 - imageHeight) / 2,
                imageWidth,
                imageHeight
            );
        } else {
            const avatar = context.createLinearGradient(imageX, imageY, imageX + 216, imageY + 292);
            avatar.addColorStop(0, "#0ea5e9");
            avatar.addColorStop(1, "#312e81");
            context.fillStyle = avatar;
            context.fillRect(imageX, imageY, 216, 292);
            context.fillStyle = "#ffffff";
            context.font = "700 58px Segoe UI, sans-serif";
            const initials = role.name === "-" ? "—" : role.name.split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase();
            context.fillText(initials, imageX + 108, imageY + 162);
        }
        context.restore();

        context.strokeStyle = "rgba(255,255,255,.18)";
        context.lineWidth = 3;
        roundedVideoRect(context, imageX, imageY, 216, 292, 18);
        context.stroke();

        const textX = x + 270;
        const textWidth = cardWidth - 296;
        context.textAlign = "left";
        context.fillStyle = "#94a3b8";
        context.font = "700 24px Segoe UI, sans-serif";
        wrapVideoText(context, role.title.toUpperCase(), textX, y + 58, textWidth, 30, 2);
        context.fillStyle = "#f8fafc";
        context.font = "700 36px Segoe UI, sans-serif";
        wrapVideoText(context, role.name, textX, y + 132, textWidth, 44, 3);
        context.fillStyle = "#38bdf8";
        context.font = "600 32px Segoe UI, sans-serif";
        context.textAlign = "right";
        context.direction = "rtl";
        context.fillText(role.arabicName || "-", x + cardWidth - 24, y + cardHeight - 92, textWidth);
        context.direction = "inherit";
        if (role.period) {
            const periodWidth = Math.min(180, textWidth);
            const periodX = textX;
            const periodY = y + cardHeight - 64;
            context.fillStyle = "rgba(56,189,248,.15)";
            roundedVideoRect(context, periodX, periodY - 30, periodWidth, 42, 21);
            context.fill();
            context.textAlign = "center";
            context.fillStyle = "#7dd3fc";
            context.font = "600 20px Segoe UI, sans-serif";
            context.fillText(role.period, periodX + periodWidth / 2, periodY - 2, periodWidth - 16);
        }
    });

    const trackX = 88;
    const trackY = 1710;
    const trackWidth = width - 176;
    context.textAlign = "center";
    context.fillStyle = "#94a3b8";
    context.font = "500 24px Segoe UI, sans-serif";
    context.fillText(
        `${frame.year}  ·  ${getVideoYearEnd(countryData[countryName])}`,
        width / 2,
        1770
    );
    context.fillStyle = "rgba(255,255,255,.14)";
    roundedVideoRect(context, trackX, trackY, trackWidth, 10, 5);
    context.fill();
    context.fillStyle = "#38bdf8";
    roundedVideoRect(context, trackX, trackY, Math.max(10, trackWidth * progress), 10, 5);
    context.fill();
    context.fillStyle = "#64748b";
    context.font = "500 20px Segoe UI, sans-serif";
    context.fillText("HISTORICAL TIMELINE", width / 2, 1830);
}

function finishVideoExport(message) {
    if (videoAnimationFrame) {
        cancelAnimationFrame(videoAnimationFrame);
        videoAnimationFrame = 0;
    }
    if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
    }
    videoImageObjectUrls.forEach(url => URL.revokeObjectURL(url));
    videoImageObjectUrls = [];
    videoRecorder = null;
    videoExporting = false;
    videoExportButton.disabled = false;
    videoExportButton.textContent = "Generate TikTok Video";
    countrySelect.disabled = false;
    currentYear = savedYear;
    currentIndex = savedIndex;
    updateYearDisplay();
    showCurrentPerson();
    videoStatus.textContent = message;
    if (videoWasPlaying) {
        playYear();
    }
}

async function generateTikTokVideo() {
    if (videoExporting) {
        videoCancelled = true;
        videoStatus.textContent = "Stopping video export...";
        if (videoRecorder && videoRecorder.state !== "inactive") {
            videoRecorder.stop();
        }
        return;
    }
    if (!HTMLCanvasElement.prototype.captureStream || typeof MediaRecorder === "undefined") {
        videoStatus.textContent = "Video export is not supported in this browser. Try a recent Chrome or Edge browser.";
        return;
    }

    const countryName = countrySelect.value;
    const country = countryData[countryName];
    const frames = getVideoFrames(country);
    if (!frames.length) {
        videoStatus.textContent = `No timeline years are available for ${countryName}.`;
        return;
    }
    let localImagesDirectory = null;
    if (window.location.protocol === "file:") {
        if (!window.showDirectoryPicker) {
            videoStatus.textContent = "This browser cannot grant access to local image files from a file URL. Open the Presidents folder in VS Code and start Live Server, then use its http://localhost address to generate the video.";
            return;
        }
        try {
            videoStatus.textContent = "Choose the project's images folder so the portraits can be included in the video.";
            localImagesDirectory = await window.showDirectoryPicker({
                id: "timeline-video-images",
                mode: "read"
            });
        } catch (error) {
            if (error.name === "AbortError") {
                videoStatus.textContent = "Video export cancelled before recording.";
                return;
            }
            videoStatus.textContent = `Could not access the images folder: ${error.message}`;
            return;
        }
    }
    const roleTitles = [
        document.getElementById("presidentTitle").textContent,
        document.getElementById("pmTitle").textContent,
        document.getElementById("speakerTitle").textContent
    ];
    const roleLists = [country.presidents, country.primeMinisters, country.parliamentPresidents];
    const imageSources = [...new Set([
        ...roleLists.flatMap(list => list.map(person => person.img)),
        ...country.flags.map(flag => flag.img)
    ].filter(Boolean))];
    const images = new Map();
    videoExporting = true;
    videoCancelled = false;
    videoFailureMessage = "";
    videoWasPlaying = Boolean(yearTimer);
    savedYear = currentYear;
    savedIndex = currentIndex;
    clearInterval(yearTimer);
    yearTimer = null;
    videoExportButton.disabled = true;
    videoExportButton.textContent = "Preparing Video...";
    countrySelect.disabled = true;
    videoStatus.textContent = "Preparing portraits for the TikTok video...";

    try {
        const loadedImages = await Promise.all(
            imageSources.map(src => loadVideoImage(src, localImagesDirectory))
        );
        const failedImages = [];
        loadedImages.forEach(({ src, image }) => {
            if (image) {
                images.set(src, image);
            } else if (src) {
                failedImages.push(src);
            }
        });
        if (failedImages.length) {
            videoStatus.textContent = `Some portraits could not be loaded (${failedImages.length}). Check the image files in the selected folder.`;
        }
        if (videoCancelled) {
            finishVideoExport("Video export cancelled.");
            return;
        }

        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1920;
        let context = canvas.getContext("2d");
        if (!context) {
            throw new Error("Could not create the video canvas.");
        }
        const mimeType = [
            "video/mp4;codecs=avc1.42E01E",
            "video/mp4",
            "video/webm;codecs=vp9",
            "video/webm;codecs=vp8",
            "video/webm"
        ]
            .find(type => MediaRecorder.isTypeSupported(type));
        if (!mimeType) {
            throw new Error("This browser does not support WebM video recording.");
        }

        const stepDuration = 0.65;
        const totalDuration = frames.length * stepDuration;
        let elapsed = 0;
        let lastTimestamp = null;
        let lastFrameIndex = -1;
        const render = timestamp => {
            if (!videoExporting) {
                return;
            }
            if (document.hidden) {
                lastTimestamp = null;
                videoAnimationFrame = requestAnimationFrame(render);
                return;
            }
            if (lastTimestamp !== null) {
                elapsed += Math.min((timestamp - lastTimestamp) / 1000, 0.1);
            }
            lastTimestamp = timestamp;
            const frameIndex = Math.min(Math.floor(elapsed / stepDuration), frames.length - 1);
            const frame = frames[frameIndex];
            if (frameIndex !== lastFrameIndex) {
                const count = frame.count;
                const roles = [
                    getVideoRole(country.presidents, frame.year, frame.index, count, roleTitles[0]),
                    getVideoRole(country.primeMinisters, frame.year, frame.index, count, roleTitles[1]),
                    getVideoRole(country.parliamentPresidents, frame.year, frame.index, count, roleTitles[2])
                ];
                if (country.showSpeakers === false) {
                    roles.pop();
                }
                drawTikTokFrame(context, canvas, countryName, frame, roles, images, elapsed / totalDuration);
                videoStatus.textContent = `Recording ${countryName}: ${frame.year} (${frameIndex + 1} of ${frames.length})`;
                lastFrameIndex = frameIndex;
            }
            if (elapsed >= totalDuration) {
                videoRecorder.stop();
                return;
            }
            videoAnimationFrame = requestAnimationFrame(render);
        };

        const firstFrame = frames[0];
        const initialRoles = [
            getVideoRole(country.presidents, firstFrame.year, firstFrame.index, firstFrame.count, roleTitles[0]),
            getVideoRole(country.primeMinisters, firstFrame.year, firstFrame.index, firstFrame.count, roleTitles[1]),
            getVideoRole(country.parliamentPresidents, firstFrame.year, firstFrame.index, firstFrame.count, roleTitles[2])
        ];
        if (country.showSpeakers === false) {
            initialRoles.pop();
        }
        drawTikTokFrame(context, canvas, countryName, firstFrame, initialRoles, images, 0);
        try {
            context.getImageData(0, 0, 1, 1);
        } catch {
            throw new Error("The browser blocked portrait images in the video. If this page was opened as a file, choose the project's images folder when asked. Otherwise, serve the page and images from the same website.");
        }
        videoStream = canvas.captureStream(30);
        videoRecorder = new MediaRecorder(videoStream, {
            mimeType,
            videoBitsPerSecond: 6000000
        });
        videoChunks = [];
        videoRecorder.ondataavailable = event => {
            if (event.data.size) {
                videoChunks.push(event.data);
            }
        };
        videoRecorder.onstop = () => {
            const cancelled = videoCancelled;
            const failureMessage = videoFailureMessage;
            const blob = new Blob(videoChunks, { type: mimeType });
            videoChunks = [];
            const extension = mimeType.startsWith("video/mp4") ? "mp4" : "webm";
            const emptyVideoMessage = !blob.size && !cancelled && !failureMessage
                ? "The browser created an empty video. Try another supported browser."
                : "";
            finishVideoExport(failureMessage || emptyVideoMessage || (cancelled
                ? "Video export cancelled."
                : `Video downloaded: ${countryName} historical timeline.${extension === "webm" ? " This browser exported WebM; MP4 is preferred for TikTok." : ""}`));
            if (!cancelled && !failureMessage && !emptyVideoMessage) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `${countryName.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-historical-timeline-${country.startYear}-${getVideoYearEnd(country)}.${extension}`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
            }
        };
        videoRecorder.onerror = () => {
            videoFailureMessage = "The video recorder encountered an error. Please try again.";
            videoStatus.textContent = videoFailureMessage;
            if (videoRecorder && videoRecorder.state !== "inactive") {
                videoRecorder.stop();
            } else {
                finishVideoExport(videoFailureMessage);
            }
        };
        videoRecorder.start(1000);
        videoExportButton.disabled = false;
        videoExportButton.textContent = "Cancel Video";
        videoStatus.textContent = `Recording ${countryName} from ${country.startYear} to ${getVideoYearEnd(country)}. Keep this tab open.${failedImages.length ? ` ${failedImages.length} portrait image(s) could not be loaded.` : ""}`;
        videoAnimationFrame = requestAnimationFrame(render);
    } catch (error) {
        finishVideoExport(`Could not create the video: ${error.message}`);
    }
}

videoExportButton.addEventListener("click", generateTikTokVideo);
countrySelect.addEventListener("change", changeCountry);
window.addEventListener("resize", updateYearDisplay);
changeCountry();


</script>
