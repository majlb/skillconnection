<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Historical Timeline</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:'Segoe UI',Tahoma,sans-serif;
    color:#f8fafc;

    background:
        radial-gradient(circle at top left,
            rgba(59,130,246,.18),
            transparent 40%),
        radial-gradient(circle at bottom right,
            rgba(14,165,233,.15),
            transparent 40%),
        linear-gradient(
            135deg,
            #0f172a 0%,
            #111827 50%,
            #1e293b 100%
        );
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.03),
            transparent
        );
    pointer-events:none;
    z-index:0;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.05), transparent 22%),
        radial-gradient(circle at 80% 30%, rgba(59,130,246,.08), transparent 25%),
        radial-gradient(circle at 60% 80%, rgba(14,165,233,.08), transparent 30%);
    animation:skyGlow 12s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes skyGlow{
    from{
        opacity:.6;
        transform:scale(1);
    }
    to{
        opacity:1;
        transform:scale(1.05);
    }
}

.header{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    z-index:1000;
}

.header h1{
    font-size:34px;
    font-weight:700;
}

.header p{
    color:#94a3b8;
}

.country-controls{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    z-index:1000;
}

.country-controls label{
    color:#e2e8f0;
    font-weight:600;
    margin-right:10px;
}

.country-controls select{
    padding:10px 16px;
    border-radius:10px;
    border:1px solid #334155;
    background:#1e293b;
    color:white;
    font-size:15px;
    min-width:180px;
    outline:none;
}

#countryStatus{
    margin-top:6px;
    font-size:14px;
    color:#94a3b8;
}

.wrapper{
    display:flex;
    height:100vh;
    padding-top:76px;
}

.side{
    width:27%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:340px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.04)
        );

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.10);

    border-radius:24px;

    padding:24px;

    text-align:center;

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);

    transition:.4s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:
        0 20px 50px rgba(0,0,0,.45);
}

.card img{
    width:250px;
    height:320px;
    object-fit:cover;

    border-radius:18px;

    border:2px solid rgba(255,255,255,.15);

    box-shadow:
        0 10px 25px rgba(0,0,0,.35);
}

.title{
    margin-top:18px;
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#94a3b8;
}

.name{
    margin-top:8px;
    font-size:28px;
    color:#ffffff;
    font-weight:700;
    line-height:1.25;
}

#presidentArabicName,
#pmArabicName,
#speakerArabicName{
    color:#38bdf8;
    font-size:24px;
    direction:rtl;
}

.period{
    margin-top:14px;

    display:inline-block;

    padding:7px 18px;

    border-radius:999px;

    background:rgba(56,189,248,.15);

    color:#7dd3fc;

    font-size:14px;

    font-weight:600;
}

.periodSmall{
    margin-top:6px;
    color:#94a3b8;
    font-size:12px;
}

.timeline-column{
    width:19%;
    display:flex;
    flex-direction:column;
    min-height:0;
}

.timeline{
    width:100%;
    flex:1;
    min-height:0;
    position:relative;
    overflow:hidden;
}

.wrapper:has(.incident-bubble){
    overflow-x:auto;
}

.wrapper:has(.incident-bubble) .side{
    flex:1 0 330px;
}

.timeline-column:has(.incident-bubble){
    width:330px;
    flex-shrink:0;
}

.timeline:has(.incident-bubble) .line,
.timeline:has(.incident-bubble) .center-year{
    left:70px;
}

.timeline:has(.incident-bubble) .year{
    justify-content:flex-start;
    padding-left:45px;
}

.timeline:has(.incident-bubble) .year.active{
    color:transparent;
}

.line{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    width:5px;
    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            to bottom,
            #38bdf8,
            #2563eb
        );
}

.center-year{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:130px;
    height:130px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #0ea5e9
        );

    border:4px solid rgba(255,255,255,.2);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    font-weight:800;

    color:white;

    box-shadow:
        0 0 40px rgba(37,99,235,.45);

    z-index:100;
}

.years{
    position:absolute;
    width:100%;
    transition:transform 1.2s linear;
}

.year{
    position:relative;
    height:80px;
    display:flex;
    justify-content:center;
    align-items:center;

    font-size:20px;
    color:#64748b;

    transition:.4s;
}

.year.active{
    color:white;
    font-size:42px;
    font-weight:800;

    text-shadow:
        0 0 20px rgba(56,189,248,.85);
}

.controls{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
}

button{
    padding:10px 20px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    margin:0 5px;

    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

.pause{
    background:#dc2626;
    color:white;
}

.play{
    background:#16a34a;
    color:white;
}

.year-value{
    font-size:48px;
    font-weight:bold;
    color:white;
}

.incident-bubble{
    position:absolute;

    left:150px;
    top:50%;

    transform:translateY(-50%);

    width:190px;

    padding:10px 12px;

    border-radius:14px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.05)
        );

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.1);

    border-left:4px solid #38bdf8;

    color:#e2e8f0;

    font-size:11px;

    line-height:1.3;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.incident-bubble::before{
    content:"";
    position:absolute;
    left:-7px;
    top:50%;
    width:12px;
    height:12px;
    background:#38bdf8;
    transform:translateY(-50%) rotate(45deg);
}

.year.active .incident-bubble{
    box-shadow:
        0 10px 28px rgba(0,0,0,.28),
        0 0 0 1px rgba(56,189,248,.4);
}

.incident-bubble span{
    display:block;
}

.incident-bubble [lang="en"]{
    font-weight:700;
}

.incident-bubble [lang="ar"]{
    margin-top:5px;
    color:#cbd5e1;
    direction:rtl;
}

.flag-container{
    flex:0 0 130px;

    display:grid;

    grid-template-columns:70px 140px 70px;

    gap:12px;

    align-items:center;

    justify-content:center;

    padding:10px 0 24px;
}

.flag-container[hidden]{
    display:none;
}

.flag-slot{
    text-align:center;
    opacity:.3;
    transition:.3s;
}

.flag-slot.current{
    opacity:1;
}

.flag-container img{
    width:70px;
    height:45px;
    object-fit:contain;
    border-radius:6px;
}

.flag-slot.current img{
    width:140px;
    height:90px;

    border-radius:10px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.40);
}

.flag-slot figcaption{
    margin-top:6px;
    font-size:11px;
    color:#94a3b8;
}

</style>
</head>

const END_YEAR = 2026;

function getIncident(year) {
    return activeCountry.incidents.find(i => i.year === year);
}
const yearsContainer =
document.getElementById("years");

function buildYears() {
yearsContainer.replaceChildren();
for(let year=activeCountry.startYear; year<=END_YEAR; year++){

    const div=document.createElement("div");

    div.className="year";
    div.id="year-"+year;
    div.textContent=year;

    const incident = getIncident(year);
    if (incident) {
        const bubble = document.createElement("div");
        bubble.className = "incident-bubble";
        const name = document.createElement("span");
        name.lang = "en";
        name.textContent = incident.name;
        const arabicName = document.createElement("span");
        arabicName.lang = "ar";
        arabicName.dir = "rtl";
        arabicName.textContent = incident["name-arabic"];
        bubble.appendChild(name);
        bubble.appendChild(arabicName);
        div.appendChild(bubble);
    }

    yearsContainer.appendChild(div);

}

}

function playYear() {
    clearInterval(yearTimer);

    const presidentsForYear =
        findPersons(activeCountry.presidents, currentYear);

    const pmsForYear =
        findPersons(activeCountry.primeMinisters, currentYear);

  
	const speakersForYear =
    findPersons(
        activeCountry.parliamentPresidents,
        currentYear
    );

const count = Math.max(
    presidentsForYear.length || 1,
    pmsForYear.length || 1,
    speakersForYear.length || 1
);

    currentIndex = 0;

    updateYearDisplay();
    showCurrentPerson();

    yearTimer = setInterval(() => {

        currentIndex++;

        if (currentIndex >= count) {

            clearInterval(yearTimer);

            currentYear++;

            if (currentYear > END_YEAR) {
                currentYear = activeCountry.startYear;
            }

            playYear();
            return;
        }

        showCurrentPerson();

    }, PERSON_DURATION); // always 1 second per person
}

function findFlag(year) {
    return activeCountry.flags.find(
    f => year >= f.start && year < f.end
  );
}

function updateFlagPreview(prefix, flag) {
    const slot = document.getElementById(prefix + "Slot");
    const image = document.getElementById(prefix + "Image");
    const period = document.getElementById(prefix + "Period");
    slot.style.visibility = flag ? "visible" : "hidden";
    if (flag) {
        image.src = flag.img;
        image.alt = document.getElementById("countrySelect").value + " flag (" + flag.start + "-" + (flag.end > END_YEAR ? "present" : flag.end) + ")";
        period.textContent = "[" + flag.start + "-" + (flag.end > END_YEAR ? "" : flag.end) + "]";
    } else {
        image.removeAttribute("src");
        period.textContent = "";
    }
}

function updateFlags() {
    const flag = findFlag(currentYear);
    const index = activeCountry.flags.indexOf(flag);
    document.getElementById("flagContainer").hidden = !flag;
    updateFlagPreview("flag", flag);
    updateFlagPreview("previousFlag", index > 0 ? activeCountry.flags[index - 1] : null);
    updateFlagPreview("nextFlag", index >= 0 ? activeCountry.flags[index + 1] : null);
}

    document.getElementById("countryStatus").textContent = hasRecords
        ? "" : "No records available for " + country;
    updateYearDisplay();
    showCurrentPerson();
    if (hasRecords) {
        playYear();
    }
}

document.getElementById("countrySelect").addEventListener("change", changeCountry);
window.addEventListener("resize", updateYearDisplay);
changeCountry();


</script>

</body>
</html>
