apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillconnect-web
  labels: { app: skillconnect-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: skillconnect-web }
  template:
    metadata:
      labels: { app: skillconnect-web }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: skillconnect-web
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: API_UPSTREAM, value: "http://skillconnect-api:8080" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: skillconnect-web
spec:
  selector: { app: skillconnect-web }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skillconnect-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: skillconnect-web }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
