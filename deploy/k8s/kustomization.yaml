apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skillconnect
resources:
  - namespace.yaml
  - config.yaml
  - storage.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
images:
  - name: skillconnect-api
    newName: skillconnectacr.azurecr.io/skillconnect-api
    newTag: latest
  - name: skillconnect-web
    newName: skillconnectacr.azurecr.io/skillconnect-web
    newTag: latest
