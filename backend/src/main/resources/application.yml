server:
  port: ${PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-* from the ingress / nginx so OAuth redirect URIs use the public host.
  forward-headers-strategy: framework

spring:
  application:
    name: skillconnect-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillconnect}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:NewPassword123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:replace-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:replace-me}
            scope: openid,profile,email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:replace-me}
            client-secret: ${FACEBOOK_CLIENT_SECRET:replace-me}
            scope: email,public_profile
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # Must be a Base64-encoded key of at least 256 bits. Override in every non-local environment.
    secret: ${JWT_SECRET:c2tpbGxjb25uZWN0LWxvY2FsLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS0yNTZiaXRz}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  payments:
    platform-fee-percent: 15
    default-deposit-percent: 20
  notifications:
    email-enabled: ${EMAIL_ENABLED:false}
    sms-enabled: ${SMS_ENABLED:false}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
