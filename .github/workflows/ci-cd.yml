name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # OIDC federation to Azure (no long-lived secrets)

env:
  ACR: skillconnectacr.azurecr.io

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name ${ACR%%.*}
      - name: Build & push images
        run: |
          docker build -t $ACR/skillconnect-api:${{ github.sha }} backend
          docker build -t $ACR/skillconnect-web:${{ github.sha }} \
            --build-arg VITE_OAUTH_BASE=https://skillconnect.example.com \
            --build-arg VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} frontend
          docker push $ACR/skillconnect-api:${{ github.sha }}
          docker push $ACR/skillconnect-web:${{ github.sha }}
      - uses: azure/aks-set-context@v4
        with: { resource-group: skillconnect-rg, cluster-name: skillconnect-aks }
      - name: Deploy
        working-directory: deploy/k8s
        run: |
          kustomize edit set image skillconnect-api=$ACR/skillconnect-api:${{ github.sha }} skillconnect-web=$ACR/skillconnect-web:${{ github.sha }}
          kubectl apply -k .
          kubectl -n skillconnect rollout status deploy/skillconnect-api --timeout=300s
          kubectl -n skillconnect rollout status deploy/skillconnect-web --timeout=120s
